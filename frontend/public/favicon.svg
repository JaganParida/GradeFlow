<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="gf-bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gf-bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gf-bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="gf-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="16" fill="url(#gf-bg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- GradeFlow 3-Bar Ascending Logo Mark -->
  <g filter="url(#gf-shadow)">
    <!-- Bar 1 (Light Blue) -->
    <rect x="15" y="34" width="8" height="16" rx="4" fill="url(#gf-bar1)"/>
    <!-- Bar 2 (Royal Blue) -->
    <rect x="28" y="24" width="8" height="26" rx="4" fill="url(#gf-bar2)"/>
    <!-- Bar 3 (Deep Navy Blue) -->
    <rect x="41" y="14" width="8" height="36" rx="4" fill="url(#gf-bar3)"/>
  </g>
</svg>
